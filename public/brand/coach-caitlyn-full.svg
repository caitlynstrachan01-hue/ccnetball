<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" width="1400" height="320" role="img" aria-label="Coach Caitlyn logo">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63B7A"/>
      <stop offset="60%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#FFB4A2"/>
    </linearGradient>
    <linearGradient id="caitlynGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63B7A"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
  </defs>

  <g transform="translate(40,40)">
    <circle cx="120" cy="120" r="120" fill="url(#markGrad)"/>
    <text x="120" y="120"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, system-ui, sans-serif"
          font-weight="800"
          font-size="135"
          letter-spacing="-11"
          fill="#FFFFFF">CC</text>
  </g>

  <text x="320" y="160"
        dominant-baseline="central"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-weight="800"
        font-size="128"
        letter-spacing="-4"
        fill="#1A1F36">
    <tspan>Coach</tspan>
  </text>

  <text x="660" y="160"
        dominant-baseline="central"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-weight="800"
        font-size="128"
        letter-spacing="-4"
        fill="url(#caitlynGrad)">
    <tspan>Caitlyn</tspan>
  </text>
</svg>
