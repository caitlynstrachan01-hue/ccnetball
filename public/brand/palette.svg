<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="CCNetball brand palette">
  <rect width="1200" height="500" fill="#FDFAF7"/>

  <text x="60" y="70"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-weight="800"
        font-size="44"
        fill="#1A1F36"
        letter-spacing="-1.5">Brand Palette</text>
  <text x="60" y="110"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-weight="500"
        font-size="22"
        fill="#5A6178">CCNetball — primary, secondary, accent, neutrals</text>

  <!-- Raspberry -->
  <g transform="translate(60,160)">
    <rect width="220" height="220" rx="20" fill="#E63B7A"/>
    <text x="0" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Raspberry</text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#E63B7A</text>
  </g>

  <!-- Raspberry Dark -->
  <g transform="translate(310,160)">
    <rect width="160" height="220" rx="20" fill="#B82A60"/>
    <text x="0" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Raspberry Dark</text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#B82A60</text>
  </g>

  <!-- Coral -->
  <g transform="translate(500,160)">
    <rect width="160" height="220" rx="20" fill="#FFB4A2"/>
    <text x="0" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Coral</text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#FFB4A2</text>
  </g>

  <!-- Navy -->
  <g transform="translate(690,160)">
    <rect width="220" height="220" rx="20" fill="#1A1F36"/>
    <text x="0" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Navy</text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#1A1F36</text>
  </g>

  <!-- Cream -->
  <g transform="translate(940,160)">
    <rect width="100" height="220" rx="20" fill="#FDFAF7" stroke="#EDE5DC"/>
    <text x="0" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Cream</text>
    <text x="0" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#FDFAF7</text>
  </g>

  <!-- Cream Warm -->
  <g transform="translate(1070,160)">
    <rect width="70" height="220" rx="20" fill="#F8F2EA" stroke="#EDE5DC"/>
    <text x="-30" y="260" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="700" font-size="18" fill="#1A1F36">Cream Warm</text>
    <text x="-30" y="285" font-family="'Plus Jakarta Sans',Arial,system-ui,sans-serif" font-weight="500" font-size="16" fill="#5A6178">#F8F2EA</text>
  </g>
</svg>
